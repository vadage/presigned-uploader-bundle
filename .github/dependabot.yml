# Keeps pinned versions current: action SHAs and image digests are updated together with their version comments.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ['*'] }

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    ignore:
      # Stay on the MySQL LTS line; Dependabot cannot tell LTS from innovation releases (e.g. 26.x). LTS upgrades are manual.
      - dependency-name: mysql
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker
    directory: /docker/php
    schedule: { interval: weekly }

  - package-ecosystem: composer
    directory: /
    schedule: { interval: weekly }
    groups:
      dev-dependencies: { dependency-type: development }

  - package-ecosystem: npm
    directory: /assets
    schedule: { interval: weekly }
    groups:
      dev-dependencies: { dependency-type: development }
